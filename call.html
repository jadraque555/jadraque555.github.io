<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Call Jayson's AI</title>
<meta name="description" content="A live voice call with Jayson's AI twin. Just join and talk.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<meta name="theme-color" content="#07080d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="agent/agent.css">
<link rel="stylesheet" href="agent/call.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.3.3/lib/three-vrm.module.min.js"}}</script>
</head>
<body class="call">
<div id="agent" class="call-app" data-phase="call">

  <!-- call -->
  <section class="stagewrap" id="callUI">
    <header class="topbar">
      <div class="meet"><span class="rec"></span><b>Jayson AI</b><span class="sep">·</span><time id="timer">00:00</time></div>
      <div class="agent-status" id="agentStatus" data-state="idle"><i></i><span>Connecting…</span></div>
    </header>

    <div class="tiles">
      <div class="tile main" id="mainTile">
        <div class="avatar-wrap" id="avatar"></div>
        <div class="nameplate"><span class="wave" id="aiWave"><i></i><i></i><i></i></span>Jayson AI</div>
      </div>
      <div class="tile self" id="selfTile">
        <div class="selfavatar">You</div>
        <canvas id="meter" width="120" height="28"></canvas>
        <div class="nameplate small" id="selfName">You</div>
      </div>
    </div>

    <button type="button" class="tapstart" id="tapStart" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>Tap to turn on sound</button>

    <div class="captions" id="captions" aria-live="polite"><p id="capAI"></p><p id="capYou"></p></div>

    <aside class="chatpanel" id="chatPanel" hidden>
      <div class="chathead"><b>Transcript</b><button type="button" id="chatClose" aria-label="Close transcript">✕</button></div>
      <div class="agent-log" id="agentLog" role="log"></div>
      <form class="chatform" id="agentForm" autocomplete="off">
        <input id="agentText" type="text" maxlength="400" placeholder="Type instead…" aria-label="Type a question">
        <button type="submit" id="agentSend">Send</button>
      </form>
    </aside>

    <footer class="controls">
      <button type="button" class="ctl" id="micBtn" aria-pressed="false" title="Mute microphone (M)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg>
        <span>Mic</span>
      </button>
      <button type="button" class="ctl on" id="ccBtn" aria-pressed="true" title="Captions (C)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 10a2 2 0 1 0 0 4M17 10a2 2 0 1 0 0 4"/></svg>
        <span>Captions</span>
      </button>
      <button type="button" class="ctl" id="chatBtn" aria-pressed="false" title="Transcript and typing (T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Chat</span>
      </button>
      <button type="button" class="ctl" id="muteBtn" aria-pressed="false" title="Silence the AI's voice">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 6a9 9 0 0 1 0 12"/></svg>
        <span>Voice</span>
      </button>
      <button type="button" class="ctl end" id="endBtn" title="Leave call">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" transform="rotate(135 12 12)"/></svg>
        <span>Leave</span>
      </button>
    </footer>
  </section>

  <!-- ended -->
  <main class="lobby" id="ended" hidden>
    <div class="lobby-card">
      <h1>Call ended</h1>
      <p id="endedTime"></p>
      <button class="join" id="rejoinBtn" type="button">Rejoin</button>
      <p class="lobby-note">For hiring or pricing, email <a href="mailto:jadraquejaysonl@gmail.com">jadraquejaysonl@gmail.com</a>. I reply personally.</p>
      <a class="back" href="./">← Back to portfolio</a>
    </div>
  </main>
</div>
<script>window.AGENT_CONFIG={apiUrl:"https://portfolio-agent-api-gules.vercel.app/api/chat",avatarPhoto:"img/avatar-portrait.jpg",avatarBg:"img/avatar-office.jpg",avatarMatte:"img/avatar-matte.png",avatarModel:""};</script>
<script src="agent/avatar.js"></script>
<script src="agent/avatarPhoto.js"></script>
<script src="agent/call.js"></script>
</body>
</html>
